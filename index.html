<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Soriana Estantes Emoji</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f8f8;
    }
    h1 {
      color: #d32f2f;
    }
    #game {
      display: none;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 20px;
      gap: 40px;
    }
    #productos {
      font-size: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      width: 30%;
    }
    .producto {
      cursor: grab;
    }
    #estantes {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 50%;
    }
    .estante {
      font-size: 30px;
      border: 2px dashed #888;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffbe6;
      border-radius: 10px;
    }
    #info {
      margin-top: 15px;
      font-size: 18px;
    }
    #startBtn, #restartBtn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #388e3c;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    #restartBtn {
      background: #d32f2f;
      display: none;
    }
  </style>
</head>
<body>
  <h1>🛒 Tu Mini Soriana</h1>
  <p id="gerente">👨🏻‍💼 Bienvenido, coloca los productos en los estantes correctos.</p>
  <button id="startBtn">Comenzar</button>
  <button id="restartBtn">Reiniciar</button>

  <div id="game">
    <div id="productos"></div>
    <div id="estantes">
      <div class="estante" data-pos="superior">🟫 Estante Superior</div>
      <div class="estante" data-pos="medio">🟫 Estante Medio</div>
      <div class="estante" data-pos="inferior">🟫 Estante Inferior</div>
    </div>
  </div>

  <div id="info">
    <p id="instruccion">Esperando orden...</p>
    <p>Puntos: <span id="score">0</span> | Nivel: <span id="level">1</span> | Tiempo: <span id="time">10</span></p>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const gameDiv = document.getElementById('game');
    const productosDiv = document.getElementById('productos');
    const instruccionP = document.getElementById('instruccion');
    const scoreSpan = document.getElementById('score');
    const levelSpan = document.getElementById('level');
    const timeSpan = document.getElementById('time');
    const estantes = document.querySelectorAll('.estante');

    const productosBase = [
      {emoji:"🥛", nombre:"leche"},
      {emoji:"🍞", nombre:"pan"},
      {emoji:"🍎", nombre:"manzana"},
      {emoji:"🧼", nombre:"jabón"},
      {emoji:"🍗", nombre:"pollo"}
    ];

    let score = 0;
    let level = 1;
    let time = 10;
    let timer;
    let objetivo = {};
    let objetivoEstante = "";

    function startGame(){
      startBtn.style.display = "none";
      restartBtn.style.display = "inline-block";
      gameDiv.style.display = "flex";
      score = 0;
      level = 1;
      updateHUD();
      newLevel();
    }

    function restartGame(){
      clearInterval(timer);
      score = 0;
      level = 1;
      updateHUD();
      newLevel();
    }

    function updateHUD(){
      scoreSpan.textContent = score;
      levelSpan.textContent = level;
      timeSpan.textContent = time;
    }

    function newLevel(){
      clearInterval(timer);
      time = [10,7,5,3][Math.min(level-1,3)];
      updateHUD();

      productosDiv.innerHTML = "";
      productosBase.forEach(p => {
        let span = document.createElement("span");
        span.textContent = p.emoji;
        span.classList.add("producto");
        span.draggable = true;
        span.dataset.nombre = p.nombre;
        productosDiv.appendChild(span);

        span.addEventListener("dragstart", e => {
          e.dataTransfer.setData("text", p.nombre);
        });
      });

      objetivo = productosBase[Math.floor(Math.random()*productosBase.length)];
      let posiciones = ["superior","medio","inferior"];
      objetivoEstante = posiciones[Math.floor(Math.random()*posiciones.length)];
      instruccionP.textContent = `👉 Coloca ${objetivo.emoji} ${objetivo.nombre} en el estante ${objetivoEstante}`;

      estantes.forEach(est => {
        est.ondragover = e => e.preventDefault();
        est.ondrop = e => {
          let nombre = e.dataTransfer.getData("text");
          if(nombre === objetivo.nombre && est.dataset.pos === objetivoEstante){
            score++;
            level++;
            updateHUD();
            newLevel();
          } else {
            endGame();
          }
        };
      });

      timer = setInterval(()=>{
        time--;
        timeSpan.textContent = time;
        if(time<=0){
          endGame();
        }
      },1000);
    }

    function endGame(){
      clearInterval(timer);
      alert(`⏰ Se acabó el tiempo o fallaste.\nPuntos: ${score} — Nivel alcanzado: ${level}`);
      startBtn.style.display = "inline-block";
      restartBtn.style.display = "none";
      gameDiv.style.display = "none";
    }

    startBtn.onclick = startGame;
    restartBtn.onclick = restartGame;
  </script>
</body>
</html>
